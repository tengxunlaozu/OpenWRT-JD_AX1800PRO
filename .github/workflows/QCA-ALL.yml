name: QCA-ALL

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: Optional OpenWrt config entries, separated by new lines.
        required: false
        type: string
      TEST:
        description: Only generate and upload the final .config; do not build firmware.
        default: false
        required: false
        type: boolean

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: https://github.com/VIKINGYFY/immortalwrt.git
  SOURCE_BRANCH: main
  WRT_THEME: aurora
  WRT_NAME: JD-AX1800PRO
  WRT_IP: 192.168.10.1
  WRT_SSID: JD-AX1800PRO
  WRT_WORD: 12345678
  WRT_PACKAGE: ${{ inputs.PACKAGE }}
  WRT_TEST: ${{ inputs.TEST }}

jobs:
  build:
    name: JDCloud AX1800 Pro
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out this repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang curl file flex bison g++ gawk gcc-multilib gettext git jq libncurses5-dev libssl-dev python3 python3-setuptools rsync unzip wget zlib1g-dev
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone ImmortalWrt source
        id: source
        run: |
          git clone --depth=1 --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPOSITORY" wrt
          cd wrt
          echo "hash=$(git log -1 --pretty=format:%h)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Update feeds and custom packages
        run: |
          cd wrt
          for attempt in 1 2 3; do
            if ./scripts/feeds update -a; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "Feed update failed; retrying in 15 seconds (attempt $attempt/3)."
            sleep 15
          done
          ./scripts/feeds install -a
          cd package
          chmod +x "$GITHUB_WORKSPACE/Scripts/Packages.sh" "$GITHUB_WORKSPACE/Scripts/Handles.sh"
          "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          "$GITHUB_WORKSPACE/Scripts/Handles.sh"

      - name: Apply JDCloud AX1800 Pro configuration
        run: |
          cd wrt
          cat "$GITHUB_WORKSPACE/Config/IPQ60XX-WIFI-YES.txt" "$GITHUB_WORKSPACE/Config/GENERAL.txt" >> .config
          chmod +x "$GITHUB_WORKSPACE/Scripts/Settings.sh"
          WRT_MARK="${GITHUB_REPOSITORY%%/*}" WRT_DATE="${{ steps.source.outputs.date }}" "$GITHUB_WORKSPACE/Scripts/Settings.sh"
          make defconfig
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp .config "$GITHUB_WORKSPACE/release/openwrt.config"

      - name: Download source packages
        if: env.WRT_TEST != 'true'
        run: |
          cd wrt
          make download -j"$(nproc)"

      - name: Build firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd wrt
          make -j2

      - name: Collect firmware
        if: env.WRT_TEST != 'true'
        run: |
          set -euo pipefail
          target_dir="$GITHUB_WORKSPACE/wrt/bin/targets/qualcommax/ipq60xx"
          test -d "$target_dir"
          echo "=== Targets directory files ==="
          ls -lh "$target_dir"
          find "$target_dir" -maxdepth 1 -type f \( -name '*jdcloud_re-ss-01*' -o -name '*re-ss-01*' \) -exec cp -v {} "$GITHUB_WORKSPACE/release" \;
          test -n "$(find "$GITHUB_WORKSPACE/release" -maxdepth 1 -type f -name '*.bin' -print -quit)"
          (
            cd "$GITHUB_WORKSPACE/release"
            sha256sum *.{bin,itb} > sha256sums 2>/dev/null || sha256sum *.bin > sha256sums
          )
          echo "=== Collected files in release ==="
          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jd-ax1800pro-${{ steps.source.outputs.date }}
          path: release
          if-no-files-found: error

      - name: Publish GitHub release
        if: env.WRT_TEST != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jd-ax1800pro-${{ steps.source.outputs.date }}
          name: JDCloud AX1800 Pro ${{ steps.source.outputs.date }}
          files: release/*
          body: |
            Device: JDCloud AX1800 Pro (jdcloud_re-ss-01)
            Source: VIKINGYFY/immortalwrt (${{ env.SOURCE_BRANCH }})
            Commit: ${{ steps.source.outputs.hash }}
            LAN address: ${{ env.WRT_IP }}
            Default Wi-Fi SSID: ${{ env.WRT_SSID }}
            LuCI password: none by default
